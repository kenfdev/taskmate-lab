name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskmate
          POSTGRES_PASSWORD: taskmate
          POSTGRES_DB: taskmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmate -d taskmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://taskmate:taskmate@127.0.0.1:5432/taskmate_test
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src tests
      - run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/pytest.xml
