name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskmate
          POSTGRES_PASSWORD: taskmate
          POSTGRES_DB: taskmate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskmate -d taskmate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://taskmate:taskmate@127.0.0.1:5432/taskmate_test
      LANGSMITH_TRACING: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: "1.3.0"
          node-version: "24.22.0"
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Static checks
        run: vp check
      - name: TypeScript checks
        if: always()
        run: pnpm typecheck
      - name: API and PostgreSQL tests
        if: always()
        run: vp -C apps/api test run
      - name: Build
        if: always()
        run: vp run -r build
      - name: Built service smoke test
        if: always()
        run: node scripts/smoke.ts
      - name: Install browser
        if: always()
        run: pnpm --filter @taskmate/web exec playwright install --with-deps chromium
      - name: Browser verification
        if: always()
        run: pnpm test:ui
      - name: Capture smoke formatting
        if: always()
        run: |
          vp fmt scripts/smoke.ts
          node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log("TASKMATE_SMOKE_FORMAT=" + readFileSync("scripts/smoke.ts").toString("base64"));'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: taskmate-typescript-verification
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
