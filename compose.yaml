services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: taskmate
      POSTGRES_PASSWORD: taskmate
      POSTGRES_DB: taskmate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskmate_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmate -d taskmate"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  taskmate_postgres:
