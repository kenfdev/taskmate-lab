[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "taskmate-lab"
version = "0.1.0"
description = "A local learning app for ChatGPT sign-in, tasks, and user-scoped agent memory"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "deepagents==0.7.28",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "langgraph-checkpoint-postgres>=3,<4",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=44",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-playwright>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taskmate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
